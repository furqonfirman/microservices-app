name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: microservices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-service
            context: ./user-services
          - name: auth-service
            context: ./authentication-services
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/microservices-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Compute image prefix
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "prefix=ghcr.io/${owner}/microservices" >> "$GITHUB_OUTPUT"

      - name: Update image references in kustomization
        run: |
          sed -i "s#newName: microservices/user-service#newName: ${{ steps.image.outputs.prefix }}-user-service#" k8s/kustomization.yaml
          sed -i "s#newName: microservices/auth-service#newName: ${{ steps.image.outputs.prefix }}-auth-service#" k8s/kustomization.yaml
          sed -i "s#newTag: latest#newTag: ${{ github.sha }}#g" k8s/kustomization.yaml

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Configure GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=microservices \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/
          kubectl patch deployment user-service -n microservices --type=merge -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}}}'
          kubectl patch deployment auth-service -n microservices --type=merge -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}}}'

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mysql -n microservices --timeout=180s
          kubectl rollout status deployment/user-service -n microservices --timeout=180s
          kubectl rollout status deployment/auth-service -n microservices --timeout=180s
          kubectl rollout status deployment/nginx-proxy -n microservices --timeout=120s
