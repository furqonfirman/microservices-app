apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: microservices-app
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  USER_DB_NAME: user_db
  AUTH_DB_NAME: auth_db
  JWT_EXPIRES_IN: 1h
  USER_SERVICE_PORT: "3001"
  AUTH_SERVICE_PORT: "3002"
  NODE_ENV: production
