apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: microservices
  labels:
    app: nginx-proxy
    app.kubernetes.io/name: nginx-proxy
    app.kubernetes.io/part-of: microservices-app
spec:
  type: NodePort
  selector:
    app: nginx-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
